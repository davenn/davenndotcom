<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flights</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #111; --surface2: #191919;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #f0f0f0; --muted: rgba(255,255,255,0.4); --muted2: rgba(255,255,255,0.22);
  --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.15); --danger: #ef4444;
  --nav-h: 52px;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

/* AUTH */
.auth-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.auth-overlay.hidden { display: none; }
.auth-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 40px; width: min(420px, 90vw); }
.auth-logo { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 28px; }
.auth-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
.auth-sub { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); margin-bottom: 28px; }
.auth-field { margin-bottom: 16px; }
.auth-field label { display: block; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.auth-field input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
.auth-field input:focus { border-color: var(--accent); }
.btn-auth { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.15s; }
.btn-auth:hover { opacity: 0.88; }
.auth-switch { margin-top: 20px; text-align: center; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
.auth-switch a { color: var(--accent); cursor: pointer; }
.auth-err { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--danger); margin-top: 10px; min-height: 18px; }

/* LAYOUT */
.app { height: 100vh; display: flex; flex-direction: column; }
.app.hidden { display: none; }
nav.main-nav { height: var(--nav-h); min-height: var(--nav-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
.nav-brand { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; white-space: nowrap; }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab { background: none; border: none; border-radius: 6px; padding: 6px 14px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); cursor: pointer; letter-spacing: 0.04em; transition: background 0.15s, color 0.15s; }
.nav-tab:hover { background: var(--surface2); color: var(--text); }
.nav-tab.active { background: var(--accent-dim); color: var(--accent); }
.nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.nav-user { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted2); white-space: nowrap; }
.btn-nav { background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 6px 12px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.btn-nav:hover { background: var(--border); }
.btn-nav.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-nav.accent:hover { opacity: 0.88; }
.tab-content { flex: 1; overflow: hidden; position: relative; }
.tab-pane { position: absolute; inset: 0; overflow-y: auto; display: none; }
.tab-pane.active { display: block; }
#tab-map { overflow: hidden; }

/* MAP */
.map-wrap { width: 100%; height: 100%; position: relative; background: #0d1520; }
.map-wrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
.map-wrap svg:active { cursor: grabbing; }
.country { fill: #1a2535; stroke: #0d1520; stroke-width: 0.5; }
.flight-arc { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0.5; transition: opacity 0.15s, stroke-width 0.15s; }
.flight-arc:hover { opacity: 1; stroke-width: 2; cursor: pointer; }
.airport-dot { fill: var(--accent); opacity: 0.75; }
.map-tooltip { position: absolute; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; font-family: 'DM Mono', monospace; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 10; }
.map-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; }
.map-empty p { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); }
.map-empty button { pointer-events: all; }

/* STATS */
.stats-wrap { padding: 28px; max-width: 860px; margin: 0 auto; }
.stats-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 20px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
.stat-card.accent { border-color: rgba(59,130,246,0.3); }
.stat-card.accent .stat-value { color: var(--accent); }
.stat-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
.stat-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted2); margin-top: 4px; }
.top-section-title { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.top-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.top-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.top-rank { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 20px; text-align: right; }
.top-name { flex: 1; font-size: 14px; font-weight: 600; }
.top-count { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
.stats-empty { padding: 60px 0; text-align: center; }
.stats-empty p { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); }

/* TIMELINE */
.timeline-wrap { padding: 28px; max-width: 760px; margin: 0 auto; }
.timeline-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.timeline-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.timeline-list { display: flex; flex-direction: column; gap: 10px; }
.flight-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
.flight-row:hover { border-color: var(--border2); }
.flight-route { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
.flight-route .sep { color: var(--muted); margin: 0 3px; }
.flight-meta { flex: 1; min-width: 0; }
.flight-cities { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.flight-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.flight-tag { font-family: 'DM Mono', monospace; font-size: 10px; background: var(--surface2); border-radius: 4px; padding: 2px 7px; color: var(--muted); }
.flight-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.flight-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.flight-dist { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted2); }
.btn-delete-flight { background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--muted2); transition: background 0.15s, color 0.15s, border-color 0.15s; font-size: 16px; flex-shrink: 0; line-height: 1; }
.btn-delete-flight:hover { background: rgba(239,68,68,0.1); color: var(--danger); border-color: rgba(239,68,68,0.3); }
.timeline-empty { padding: 60px 0; text-align: center; }
.timeline-empty p { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); margin-bottom: 16px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; display: flex; align-items: center; justify-content: center; }
.modal-overlay.hidden { display: none; }
.modal-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 32px; width: min(520px, 94vw); max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 24px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-field { position: relative; }
.form-field label { display: block; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.form-field input, .form-field select { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
.form-field input:focus, .form-field select:focus { border-color: var(--accent); }
.form-field select { appearance: none; }
.ac-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; z-index: 20; max-height: 200px; overflow-y: auto; }
.ac-list.hidden { display: none; }
.ac-item { padding: 9px 14px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 10px; }
.ac-item:hover { background: var(--accent-dim); }
.ac-code { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 600; width: 36px; flex-shrink: 0; }
.ac-city { flex: 1; }
.ac-country { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 20px; color: var(--muted); font-size: 14px; cursor: pointer; transition: background 0.15s; }
.btn-cancel:hover { background: var(--border); }
.btn-save { background: var(--accent); border: none; border-radius: 8px; padding: 10px 24px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.btn-save:hover { opacity: 0.88; }
.form-err { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--danger); margin-top: 10px; min-height: 18px; }
</style>
</head>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">davenn.com / flights</div>
    <div id="auth-login">
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your flight log</div>
      <div class="auth-field"><label>Username</label><input id="login-user" type="text" autocomplete="username"></div>
      <div class="auth-field"><label>Password</label><input id="login-pass" type="password" autocomplete="current-password"></div>
      <button class="btn-auth" onclick="doLogin()">Sign in</button>
      <div class="auth-err" id="login-err"></div>
      <div class="auth-switch">No account? <a onclick="showRegister()">Create one</a></div>
    </div>
    <div id="auth-register" style="display:none">
      <div class="auth-title">Create account</div>
      <div class="auth-sub">Start your flight log</div>
      <div class="auth-field"><label>Username</label><input id="reg-user" type="text" autocomplete="username"></div>
      <div class="auth-field"><label>Display name</label><input id="reg-name" type="text" autocomplete="name"></div>
      <div class="auth-field"><label>Password</label><input id="reg-pass" type="password" autocomplete="new-password"></div>
      <button class="btn-auth" onclick="doRegister()">Create account</button>
      <div class="auth-err" id="reg-err"></div>
      <div class="auth-switch">Have an account? <a onclick="showLogin()">Sign in</a></div>
    </div>
  </div>
</div>

<div class="app hidden" id="app">
  <nav class="main-nav">
    <span class="nav-brand">✈ flights</span>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="map" onclick="showTab('map')">Map</button>
      <button class="nav-tab" data-tab="stats" onclick="showTab('stats')">Stats</button>
      <button class="nav-tab" data-tab="timeline" onclick="showTab('timeline')">Timeline</button>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="nav-user"></span>
      <button class="btn-nav accent" onclick="openModal()">+ Add Flight</button>
      <button class="btn-nav" onclick="doLogout()">Log out</button>
    </div>
  </nav>
  <div class="tab-content">
    <div class="tab-pane active" id="tab-map">
      <div class="map-wrap" id="map-wrap">
        <div class="map-tooltip" id="map-tooltip"></div>
        <div class="map-empty hidden" id="map-empty">
          <p>No flights yet.</p>
          <button class="btn-nav accent" onclick="openModal()">+ Add your first flight</button>
        </div>
      </div>
    </div>
    <div class="tab-pane" id="tab-stats">
      <div class="stats-wrap" id="stats-wrap"></div>
    </div>
    <div class="tab-pane" id="tab-timeline">
      <div class="timeline-wrap">
        <div class="timeline-header">
          <div class="timeline-title">All Flights</div>
        </div>
        <div class="timeline-list" id="timeline-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="add-modal">
  <div class="modal-card">
    <div class="modal-title">Add Flight</div>
    <div class="form-row">
      <div class="form-field">
        <label>From</label>
        <input id="from-input" type="text" placeholder="JFK or New York" autocomplete="off">
        <div class="ac-list hidden" id="from-list"></div>
      </div>
      <div class="form-field">
        <label>To</label>
        <input id="to-input" type="text" placeholder="LAX or Los Angeles" autocomplete="off">
        <div class="ac-list hidden" id="to-list"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>Date</label>
        <input id="flight-date" type="date">
      </div>
      <div class="form-field">
        <label>Airline (optional)</label>
        <input id="flight-airline" type="text" placeholder="Delta, United…">
      </div>
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>Seat Class</label>
        <select id="flight-class">
          <option value="">—</option>
          <option value="Economy">Economy</option>
          <option value="Premium Economy">Premium Economy</option>
          <option value="Business">Business</option>
          <option value="First">First</option>
        </select>
      </div>
      <div class="form-field">
        <label>Flight # (optional)</label>
        <input id="flight-num" type="text" placeholder="DL 404">
      </div>
    </div>
    <div class="form-err" id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveFlight()">Save Flight</button>
    </div>
  </div>
</div>

// ── AUTH ──────────────────────────────────────────────────────────────────
function showRegister() {
  document.getElementById('auth-login').style.display = 'none';
  document.getElementById('auth-register').style.display = '';
}
function showLogin() {
  document.getElementById('auth-register').style.display = 'none';
  document.getElementById('auth-login').style.display = '';
}

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('reg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

async function doLogin() {
  const err = document.getElementById('login-err');
  err.textContent = '';
  try {
    const r = await api('ft_login', 'POST', {
      username: document.getElementById('login-user').value.trim(),
      password: document.getElementById('login-pass').value,
    });
    if (r.error) { err.textContent = r.error; return; }
    startSession(r.token, r.user);
  } catch { err.textContent = 'Network error.'; }
}

async function doRegister() {
  const err = document.getElementById('reg-err');
  err.textContent = '';
  const u = document.getElementById('reg-user').value.trim();
  const n = document.getElementById('reg-name').value.trim();
  const p = document.getElementById('reg-pass').value;
  if (!u || !n || !p) { err.textContent = 'All fields required.'; return; }
  try {
    const r = await api('ft_register', 'POST', { username: u, display_name: n, password: p });
    if (r.error) { err.textContent = r.error; return; }
    startSession(r.token, r.user);
  } catch { err.textContent = 'Network error.'; }
}

function startSession(t, user) {
  token = t; currentUser = user;
  localStorage.setItem('ft_token', t);
  localStorage.setItem('ft_user', JSON.stringify(user));
  document.getElementById('auth-overlay').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('nav-user').textContent = user.display_name;
  loadFlights();
}

async function doLogout() {
  api('ft_logout', 'POST').catch(() => {});
  token = ''; currentUser = null;
  localStorage.removeItem('ft_token');
  localStorage.removeItem('ft_user');
  flights = []; mapSvg = null; mapProjection = null;
  document.getElementById('auth-overlay').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

async function api(action, method = 'GET', body = null, extra = '') {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}?action=${action}${extra}`, opts);
  return res.json();
}

// ── DATA ──────────────────────────────────────────────────────────────────
async function loadFlights() {
  const r = await api('ft_flights');
  flights = r.flights || [];
  renderAll();
}

function renderAll() { renderMap(); renderStats(); renderTimeline(); }

// ── HAVERSINE ─────────────────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── MAP ───────────────────────────────────────────────────────────────────
async function renderMap() {
  const wrap = document.getElementById('map-wrap');
  const emptyEl = document.getElementById('map-empty');

  if (!mapSvg) {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    mapProjection = d3.geoNaturalEarth1().scale(Math.min(w,h)*0.18).translate([w/2, h/2]);
    const pathGen = d3.geoPath().projection(mapProjection);

    const svg = d3.select(wrap).append('svg').attr('width',w).attr('height',h);
    svg.append('rect').attr('width',w).attr('height',h).attr('fill','#0d1520');

    try {
      const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
      svg.append('g').selectAll('path')
        .data(topojson.feature(world, world.objects.countries).features)
        .join('path').attr('class','country').attr('d',pathGen);
    } catch {}

    svg.append('g').attr('id','arcs-g');
    svg.append('g').attr('id','dots-g');

    const zoom = d3.zoom().scaleExtent([0.5,8]).on('zoom', e => {
      svg.selectAll('g').attr('transform', e.transform);
    });
    svg.call(zoom);
    mapSvg = { svg, pathGen };
  }

  const { svg, pathGen } = mapSvg;
  const arcsG = svg.select('#arcs-g');
  const dotsG = svg.select('#dots-g');
  arcsG.selectAll('*').remove();
  dotsG.selectAll('*').remove();

  if (flights.length === 0) { emptyEl.classList.remove('hidden'); return; }
  emptyEl.classList.add('hidden');

  const tooltip = document.getElementById('map-tooltip');
  const usedCodes = new Set();

  flights.forEach(f => {
    const from = AP[f.from_code], to = AP[f.to_code];
    if (!from || !to) return;
    usedCodes.add(f.from_code); usedCodes.add(f.to_code);
    const arc = { type:'LineString', coordinates:[[from.lon,from.lat],[to.lon,to.lat]] };
    const dist = Math.round(haversine(from.lat,from.lon,to.lat,to.lon)).toLocaleString();
    arcsG.append('path').datum(arc).attr('class','flight-arc').attr('d',pathGen)
      .on('mouseover', function(event) {
        tooltip.style.opacity = '1';
        tooltip.style.left = (event.offsetX+14)+'px';
        tooltip.style.top = (event.offsetY+14)+'px';
        tooltip.innerHTML = `<strong>${f.from_code} → ${f.to_code}</strong><br>${from.city} → ${to.city}<br>${dist} km`;
      })
      .on('mousemove', function(event) {
        tooltip.style.left = (event.offsetX+14)+'px';
        tooltip.style.top = (event.offsetY+14)+'px';
      })
      .on('mouseout', () => { tooltip.style.opacity = '0'; });
  });

  usedCodes.forEach(code => {
    const ap = AP[code];
    if (!ap) return;
    const [x,y] = mapProjection([ap.lon, ap.lat]);
    if (x == null) return;
    dotsG.append('circle').attr('class','airport-dot').attr('cx',x).attr('cy',y).attr('r',3);
  });
}

// ── STATS ─────────────────────────────────────────────────────────────────
function renderStats() {
  const wrap = document.getElementById('stats-wrap');
  if (!flights.length) {
    wrap.innerHTML = '<div class="stats-empty"><p>No flights yet — add one to see your stats!</p></div>';
    return;
  }

  let totalDist = 0, longestDist = 0, longestFlight = null;
  const airports = {}, countries = new Set();

  flights.forEach(f => {
    const from = AP[f.from_code], to = AP[f.to_code];
    const d = (from && to) ? haversine(from.lat,from.lon,to.lat,to.lon) : 0;
    totalDist += d;
    if (d > longestDist) { longestDist = d; longestFlight = f; }
    airports[f.from_code] = (airports[f.from_code]||0) + 1;
    airports[f.to_code]   = (airports[f.to_code]  ||0) + 1;
    if (from) countries.add(from.country);
    if (to)   countries.add(to.country);
  });

  const uniqueAirports = new Set([...flights.map(f=>f.from_code),...flights.map(f=>f.to_code)]).size;
  const topAirports = Object.entries(airports).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const km = Math.round(totalDist).toLocaleString();
  const mi = Math.round(totalDist*0.621371).toLocaleString();

  wrap.innerHTML = `
    <div class="stats-title">Your Stats</div>
    <div class="stats-grid">
      <div class="stat-card accent">
        <div class="stat-label">Total Flights</div>
        <div class="stat-value">${flights.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Distance Flown</div>
        <div class="stat-value">${km}</div>
        <div class="stat-sub">${mi} miles</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Countries</div>
        <div class="stat-value">${countries.size}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Airports</div>
        <div class="stat-value">${uniqueAirports}</div>
      </div>
      ${longestFlight ? `
      <div class="stat-card">
        <div class="stat-label">Longest Flight</div>
        <div class="stat-value" style="font-size:18px">${longestFlight.from_code} → ${longestFlight.to_code}</div>
        <div class="stat-sub">${Math.round(longestDist).toLocaleString()} km</div>
      </div>` : ''}
    </div>
    <div class="top-section-title">Most Visited Airports</div>
    <div class="top-list">
      ${topAirports.map(([code,cnt],i) => {
        const ap = AP[code];
        return `<div class="top-item">
          <span class="top-rank">#${i+1}</span>
          <span class="top-name">${code}${ap ? ` — ${ap.city}` : ''}</span>
          <span class="top-count">${cnt} visit${cnt>1?'s':''}</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ── TIMELINE ──────────────────────────────────────────────────────────────
function renderTimeline() {
  const list = document.getElementById('timeline-list');
  if (!flights.length) {
    list.innerHTML = '<div class="timeline-empty"><p>No flights logged yet.</p><button class="btn-nav accent" onclick="openModal()">+ Add Flight</button></div>';
    return;
  }
  const sorted = [...flights].sort((a,b) => b.flight_date.localeCompare(a.flight_date));
  list.innerHTML = sorted.map(f => {
    const from = AP[f.from_code], to = AP[f.to_code];
    const dist = (from && to) ? Math.round(haversine(from.lat,from.lon,to.lat,to.lon)).toLocaleString()+' km' : '';
    const cities = [from?.city, to?.city].filter(Boolean).join(' → ');
    const date = new Date(f.flight_date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const tags = [f.airline, f.seat_class, f.flight_number].filter(Boolean);
    return `<div class="flight-row">
      <div>
        <div class="flight-route">${f.from_code}<span class="sep">→</span>${f.to_code}</div>
        <div class="flight-cities">${cities}</div>
        ${tags.length ? `<div class="flight-tags">${tags.map(t=>`<span class="flight-tag">${t}</span>`).join('')}</div>` : ''}
      </div>
      <div class="flight-meta"></div>
      <div class="flight-right">
        <span class="flight-date">${date}</span>
        ${dist ? `<span class="flight-dist">${dist}</span>` : ''}
      </div>
      <button class="btn-delete-flight" onclick="deleteFlight(${f.id})" title="Delete">×</button>
    </div>`;
  }).join('');
}

// ── TABS ──────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-'+name));
  if (name === 'map') renderMap();
}

// ── ADD MODAL ─────────────────────────────────────────────────────────────
function openModal() {
  fromSelected = null; toSelected = null;
  document.getElementById('from-input').value = '';
  document.getElementById('to-input').value = '';
  document.getElementById('flight-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('flight-airline').value = '';
  document.getElementById('flight-class').value = '';
  document.getElementById('flight-num').value = '';
  document.getElementById('modal-err').textContent = '';
  document.getElementById('add-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('from-input').focus(), 50);
}

function closeModal() {
  document.getElementById('add-modal').classList.add('hidden');
  document.getElementById('from-list').classList.add('hidden');
  document.getElementById('to-list').classList.add('hidden');
}

document.getElementById('add-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('add-modal')) closeModal();
});

function searchAP(q) {
  q = q.toLowerCase();
  if (q.length < 1) return [];
  return Object.entries(AP)
    .filter(([code,ap]) => code.toLowerCase().includes(q) || ap.city.toLowerCase().includes(q) || ap.country.toLowerCase().includes(q))
    .slice(0,8);
}

function setupAC(inputId, listId, onSelect) {
  const input = document.getElementById(inputId);
  const list  = document.getElementById(listId);
  input.addEventListener('input', () => {
    const results = searchAP(input.value);
    if (!results.length) { list.classList.add('hidden'); return; }
    list.innerHTML = results.map(([code,ap]) =>
      `<div class="ac-item" onmousedown="pickAirport('${inputId}','${listId}','${code}')">
        <span class="ac-code">${code}</span>
        <span class="ac-city">${ap.city}</span>
        <span class="ac-country">${ap.country}</span>
      </div>`
    ).join('');
    list.classList.remove('hidden');
  });
  input.addEventListener('blur', () => setTimeout(() => list.classList.add('hidden'), 150));
}

function pickAirport(inputId, listId, code) {
  const ap = AP[code];
  document.getElementById(inputId).value = `${code} — ${ap.city}`;
  document.getElementById(listId).classList.add('hidden');
  if (inputId === 'from-input') fromSelected = code;
  else toSelected = code;
}

setupAC('from-input', 'from-list');
setupAC('to-input',   'to-list');

async function saveFlight() {
  const err = document.getElementById('modal-err');
  err.textContent = '';
  if (!fromSelected) {
    const v = document.getElementById('from-input').value.trim().toUpperCase().slice(0,3);
    if (AP[v]) fromSelected = v;
  }
  if (!toSelected) {
    const v = document.getElementById('to-input').value.trim().toUpperCase().slice(0,3);
    if (AP[v]) toSelected = v;
  }
  if (!fromSelected || !toSelected) { err.textContent = 'Please select valid airports.'; return; }
  if (fromSelected === toSelected) { err.textContent = 'Departure and arrival must differ.'; return; }
  const date = document.getElementById('flight-date').value;
  if (!date) { err.textContent = 'Please select a date.'; return; }

  const r = await api('ft_add_flight', 'POST', {
    from_code: fromSelected, to_code: toSelected,
    from_city: AP[fromSelected].city, to_city: AP[toSelected].city,
    flight_date: date,
    airline: document.getElementById('flight-airline').value.trim(),
    seat_class: document.getElementById('flight-class').value,
    flight_number: document.getElementById('flight-num').value.trim(),
  });
  if (r.error) { err.textContent = r.error; return; }
  closeModal();
  await loadFlights();
}

async function deleteFlight(id) {
  if (!confirm('Delete this flight?')) return;
  await api('ft_delete_flight', 'DELETE', null, '&id='+id);
  await loadFlights();
}

// ── INIT ──────────────────────────────────────────────────────────────────
if (token && currentUser) {
  startSession(token, currentUser);
}

window.addEventListener('resize', () => {
  if (mapSvg) {
    mapSvg.svg.remove();
    mapSvg = null; mapProjection = null;
    if (document.getElementById('tab-map').classList.contains('active')) renderMap();
  }
});
</script>
