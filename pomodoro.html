<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pomodoro — davenn.com</title>
<link rel="manifest" href="/manifest-pomodoro.json">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-icon" href="/icons/pomodoro.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* ── DARK THEME (default) ── */
:root,
[data-theme="dark"] {
  --bg:          #0f0f0f;
  --text:        #ffffff;
  --surface:     rgba(255,255,255,0.04);
  --surface-border: rgba(255,255,255,0.07);
  --muted:       rgba(255,255,255,0.25);
  --muted2:      rgba(255,255,255,0.18);
  --ctrl-bg:     rgba(255,255,255,0.07);
  --ctrl-color:  rgba(255,255,255,0.4);
  --ctrl-hover:  rgba(255,255,255,0.14);
  --dot-empty:   rgba(255,255,255,0.1);
  --progress-bg: rgba(255,255,255,0.07);
  --skip-bg:     rgba(255,255,255,0.06);
  --skip-color:  rgba(255,255,255,0.3);
  --skip-hover:  rgba(255,255,255,0.1);
  --accent: #e05555;
  --nav-h: 52px;
}

/* ── LIGHT THEME ── */
[data-theme="light"] {
  --bg:          #f5f4f0;
  --text:        #111110;
  --surface:     #ffffff;
  --surface-border: rgba(0,0,0,0.09);
  --muted:       rgba(0,0,0,0.4);
  --muted2:      rgba(0,0,0,0.28);
  --ctrl-bg:     rgba(0,0,0,0.06);
  --ctrl-color:  rgba(0,0,0,0.45);
  --ctrl-hover:  rgba(0,0,0,0.12);
  --dot-empty:   rgba(0,0,0,0.1);
  --progress-bg: rgba(0,0,0,0.08);
  --skip-bg:     rgba(0,0,0,0.05);
  --skip-color:  rgba(0,0,0,0.3);
  --skip-hover:  rgba(0,0,0,0.1);
  --accent: #e05555;
  --nav-h: 52px;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  transition: background 0.2s, color 0.2s;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: #111110;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem; z-index: 200;
}
.nav-logo { font-family: 'DM Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; }
.nav-logo strong { color: #fff; }
.nav-right { display: flex; align-items: center; gap: 1.2rem; }
.nav-back { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.45); text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase; transition: color 0.15s; }
.nav-back:hover { color: #fff; }

/* ── CAST BUTTON ── */
.btn-cast {
  display: none; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; padding: 3px;
  color: rgba(255,255,255,0.45); transition: color 0.15s;
}
.btn-cast.available { display: flex; }
.btn-cast.casting   { color: var(--accent); }
.btn-cast:hover     { color: rgba(255,255,255,0.9); }
.btn-cast svg { width: 20px; height: 20px; fill: currentColor; }

/* ── THEME TOGGLE ── */
.theme-toggle {
  position: relative; width: 44px; height: 24px; cursor: pointer;
  background: none; border: none; padding: 0;
}
.theme-toggle-track {
  width: 44px; height: 24px; border-radius: 12px;
  background: #333; border: 1px solid #555;
  transition: background 0.2s, border-color 0.2s;
  display: flex; align-items: center; padding: 0 3px;
}
[data-theme="light"] .theme-toggle-track { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.35); }
.theme-toggle-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #888; transition: transform 0.2s, background 0.2s;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; line-height: 1;
}
[data-theme="light"] .theme-toggle-thumb { transform: translateX(20px); background: #fff; }
[data-theme="dark"]  .theme-toggle-thumb { transform: translateX(0); background: #666; }

/* ── CONTAINER ── */
.container {
  position: fixed;
  top: var(--nav-h); left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;   /* portrait: stack vertically */
  align-items: center;
  justify-content: center;
  padding: 1rem 1.25rem;
  gap: 14px;
}

/* ── MAIN CONTENT (phase + timer + progress) ── */
.main-content {
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column;
}

/* ── PHASE + DOTS ── */
.phase-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px;
}
.phase-label {
  font-family: monospace; font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--accent); transition: color 0.4s;
}
.session-dots { display: flex; gap: 7px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot-empty); transition: background 0.3s; }
.dot.done { background: var(--accent); }

/* ── MAIN ROW ── */
.main-row {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 14px;
}

/* ── CONTROLS ── */
.controls { display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
.btn-play {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s, opacity 0.12s, background 0.4s;
}
.btn-play:active { transform: scale(0.91); opacity: 0.8; }
.btn-play svg { width: 20px; height: 20px; fill: #fff; }
.btn-skip {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--skip-bg); border: none; cursor: pointer;
  color: var(--skip-color); padding: 0;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.btn-skip:hover { color: var(--text); background: var(--skip-hover); }
.btn-skip:active { transform: scale(0.91); }
.btn-skip svg { width: 18px; height: 18px; fill: currentColor; }

/* ── TIMER ── */
.timer {
  flex: 1;
  font-size: clamp(58px, 20vw, 140px);
  font-weight: 800; letter-spacing: -0.05em; line-height: 1;
  font-variant-numeric: tabular-nums; text-align: right;
}

/* ── PROGRESS BAR ── */
.progress-track {
  width: 100%; height: 2px;
  background: var(--progress-bg);
  border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 2px; width: 0%; transition: background 0.4s;
}

/* ── SETTINGS (portrait: 3 cards in a row below timer) ── */
.settings {
  display: flex;
  flex-direction: row;
  gap: 10px;
  width: 100%; max-width: 480px;
}
.setting {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 10px; padding: 10px 6px 8px;
}
.setting-label {
  font-family: monospace; font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
}
.setting-val-row { display: flex; align-items: center; gap: 4px; }
.btn-adj {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--ctrl-bg); border: none; cursor: pointer;
  color: var(--ctrl-color); font-size: 15px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, color 0.12s; flex-shrink: 0;
}
.btn-adj:hover  { background: var(--ctrl-hover); color: var(--text); }
.btn-adj:active { transform: scale(0.88); }
.setting-input {
  background: none; border: none;
  color: var(--text); font-size: 22px; font-weight: 300;
  width: 28px; text-align: center; padding: 0; outline: none;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  user-select: text; -webkit-user-select: text;
}
.setting-input::-webkit-inner-spin-button,
.setting-input::-webkit-outer-spin-button { -webkit-appearance: none; }

/* ── LANDSCAPE: settings left, timer right ── */
@media (orientation: landscape) {
  .container {
    flex-direction: row;
    align-items: stretch;  /* let main-content fill full height */
    justify-content: center;
    gap: 2.5rem;
    padding: 0.75rem 2rem;
  }

  /* Settings move to the left, centered vertically */
  .settings {
    order: 1;
    flex-direction: column;
    width: auto; max-width: none;
    gap: 8px;
    align-self: center;
  }

  /* Each setting becomes a horizontal row */
  .setting {
    flex: none;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-radius: 8px;
  }
  .setting-label { width: 34px; text-align: left; }

  /* Main content stretches full height */
  .main-content {
    order: 2;
    flex: 1; max-width: none; min-width: 0;
    height: 100%;
  }

  /* Main row grows to fill remaining height; establish container for cqh */
  .main-row {
    flex: 1;
    min-height: 0;
    container-type: size;
    margin-bottom: 8px;
  }

  /* Timer fills available space — min() prevents horizontal overflow */
  .timer { font-size: clamp(44px, min(90cqh, 32cqw), 600px); }

  .phase-row { margin-bottom: 8px; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html"><strong>davenn</strong>dotcom</a>
  <div class="nav-right">
    <button class="btn-cast" id="btn-cast" onclick="toggleCast()" title="Cast to display" aria-label="Cast to display">
      <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm18-7H5c-1.1 0-2 .9-2 2v3h2v-3h14v12h-5v2h5c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-18 3v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
    </button>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle theme">
      <div class="theme-toggle-track">
        <div class="theme-toggle-thumb" id="toggle-icon">🌙</div>
      </div>
    </button>
    <a class="nav-back" href="index.html">← Back</a>
  </div>
</nav>

<div class="container">

  <!-- Main content: phase + timer + progress (portrait: top, landscape: right) -->
  <div class="main-content">
    <div class="phase-row">
      <span class="phase-label" id="phase-label">Focus</span>
      <div class="session-dots" id="dots"></div>
    </div>
    <div class="main-row">
      <div class="controls">
        <button class="btn-play" id="btn-play" aria-label="Start">
          <svg id="icon-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn-skip" id="btn-skip" aria-label="Skip">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="timer" id="timer">25:00</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Settings: portrait=below timer, landscape=left column -->
  <div class="settings">
    <div class="setting">
      <span class="setting-label">Work</span>
      <div class="setting-val-row">
        <button class="btn-adj" data-key="work" data-d="-1">−</button>
        <input class="setting-input" id="inp-work" type="number" min="1" max="99">
        <button class="btn-adj" data-key="work" data-d="1">+</button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label">Short</span>
      <div class="setting-val-row">
        <button class="btn-adj" data-key="shortBreak" data-d="-1">−</button>
        <input class="setting-input" id="inp-short" type="number" min="1" max="99">
        <button class="btn-adj" data-key="shortBreak" data-d="1">+</button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label">Long</span>
      <div class="setting-val-row">
        <button class="btn-adj" data-key="longBreak" data-d="-1">−</button>
        <input class="setting-input" id="inp-long" type="number" min="1" max="99">
        <button class="btn-adj" data-key="longBreak" data-d="1">+</button>
      </div>
    </div>
  </div>

</div>

<script>
const SESSIONS = 4;
const COLORS = { work: '#e05555', shortBreak: '#27ae60', longBreak: '#2980b9' };
const LABELS = { work: '', shortBreak: 'Short Break', longBreak: 'Long Break' };
const INPUTS = { work: 'inp-work', shortBreak: 'inp-short', longBreak: 'inp-long' };
const STORE  = { work: 'pom_work', shortBreak: 'pom_short', longBreak: 'pom_long' };

const cfg = {
  work:       Math.max(1, parseInt(localStorage.getItem('pom_work'))  || 25),
  shortBreak: Math.max(1, parseInt(localStorage.getItem('pom_short')) || 5),
  longBreak:  Math.max(1, parseInt(localStorage.getItem('pom_long'))  || 15),
};

let phase = 'work', workDone = 0, timeLeft = 0, totalTime = 0;
let running = false, ticker = null, startStamp = 0, startLeft = 0;

const timerEl   = document.getElementById('timer');
const phaseEl   = document.getElementById('phase-label');
const dotsEl    = document.getElementById('dots');
const fillEl    = document.getElementById('progress-fill');
const btnPlay   = document.getElementById('btn-play');
const iconPlay  = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const inpWork   = document.getElementById('inp-work');
const inpShort  = document.getElementById('inp-short');
const inpLong   = document.getElementById('inp-long');

inpWork.value  = cfg.work;
inpShort.value = cfg.shortBreak;
inpLong.value  = cfg.longBreak;

document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-skip').addEventListener('click', skip);

document.querySelectorAll('.btn-adj').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.key;
    const el  = document.getElementById(INPUTS[key]);
    applySetting(key, el, cfg[key] + parseInt(btn.dataset.d));
  });
});

inpWork.addEventListener('change',  () => applySetting('work',       inpWork,  parseInt(inpWork.value)));
inpShort.addEventListener('change', () => applySetting('shortBreak', inpShort, parseInt(inpShort.value)));
inpLong.addEventListener('change',  () => applySetting('longBreak',  inpLong,  parseInt(inpLong.value)));

btnPlay.addEventListener('click', () => {
  if ('Notification' in window && Notification.permission === 'default')
    Notification.requestPermission();
}, { once: true });

// ── CAST ──────────────────────────────────────────────────────────────────────
const castBtn = document.getElementById('btn-cast');
let castConn  = null;
let castReq   = null;

if ('presentation' in navigator) {
  castReq = new PresentationRequest(['/pomodoro-cast.html']);
  castReq.getAvailability().then(avail => {
    castBtn.classList.toggle('available', avail.value);
    avail.addEventListener('change', () => {
      castBtn.classList.toggle('available', avail.value);
      if (!avail.value && castConn) onCastEnd();
    });
  }).catch(() => {
    // getAvailability unsupported — show button and let the picker decide
    castBtn.classList.add('available');
  });
}

async function toggleCast() {
  if (castConn) {
    castConn.terminate();
    return;
  }
  try {
    castConn = await castReq.start();
    castBtn.classList.add('casting');
    castConn.addEventListener('message', e => {
      if (JSON.parse(e.data).type === 'ready') sendCastState();
    });
    castConn.addEventListener('close',     onCastEnd);
    castConn.addEventListener('terminate', onCastEnd);
  } catch (_) { /* user cancelled */ }
}

function onCastEnd() {
  castConn = null;
  castBtn.classList.remove('casting');
}

function sendCastState() {
  if (!castConn || castConn.state !== 'connected') return;
  castConn.send(JSON.stringify({ timeLeft, totalTime, phase, running, workDone, accent: COLORS[phase] }));
}

// ── THEME ─────────────────────────────────────────────────────────────────────
function getTheme() { return localStorage.getItem('pom_theme') || 'dark'; }
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('toggle-icon').textContent = theme === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('pom_theme', theme);
}
function toggleTheme() { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
applyTheme(getTheme());

loadPhase('work');

function applySetting(key, el, rawVal) {
  const v = Math.max(1, Math.min(99, rawVal || 1));
  el.value = v;
  cfg[key] = v;
  localStorage.setItem(STORE[key], v);
  if (!running && phase === key) { loadPhase(phase); render(); }
}

function loadPhase(p) {
  phase = p; totalTime = cfg[p] * 60; timeLeft = totalTime;
  document.documentElement.style.setProperty('--accent', COLORS[p]);
}

function advance() {
  if (phase === 'work') {
    workDone++;
    if (workDone >= SESSIONS) { workDone = 0; loadPhase('longBreak'); }
    else { loadPhase('shortBreak'); }
  } else {
    loadPhase('work');
  }
}

// ── WAKE LOCK ─────────────────────────────────────────────────────────────────
let wakeLock = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
function releaseWakeLock() {
  wakeLock?.release();
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) acquireWakeLock();
});

function togglePlay() { running ? pause() : start(); }

function start() {
  running = true; startStamp = Date.now(); startLeft = timeLeft;
  ticker = setInterval(tick, 250); acquireWakeLock(); render();
}

function pause() {
  running = false; clearInterval(ticker); ticker = null; releaseWakeLock(); render();
}

function skip() { pause(); advance(); render(); }

function tick() {
  const elapsed = Math.floor((Date.now() - startStamp) / 1000);
  timeLeft = Math.max(0, startLeft - elapsed);
  if (timeLeft === 0) {
    clearInterval(ticker); ticker = null; running = false;
    releaseWakeLock(); render(); beep(); notify(); advance();
  }
  render();
}

function notify() {
  if ('Notification' in window && Notification.permission === 'granted')
    new Notification(phase === 'work' ? 'Time for a break.' : `${LABELS[phase]} complete!`, {
      body: phase === 'work' ? '' : 'Back to focus.',
      icon: '/icons/pomodoro.svg', silent: true,
    });
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 740;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.start(); osc.stop(ctx.currentTime + 0.8);
  } catch {}
}

function render() {
  const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  const display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  timerEl.textContent = display;
  phaseEl.textContent = LABELS[phase];
  document.title = LABELS[phase] ? `${display} — ${LABELS[phase]}` : display;
  const pct = totalTime > 0 ? ((totalTime - timeLeft) / totalTime) * 100 : 0;
  fillEl.style.width = pct + '%';
  fillEl.style.transition = running ? 'width 0.25s linear, background 0.4s' : 'background 0.4s';
  iconPlay.style.display  = running ? 'none' : '';
  iconPause.style.display = running ? ''     : 'none';
  dotsEl.innerHTML = Array.from({ length: SESSIONS }, (_, i) =>
    `<div class="dot${i < workDone ? ' done' : ''}"></div>`).join('');
  sendCastState();
}
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
